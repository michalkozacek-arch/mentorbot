<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Mentor Bot</title>
</head>
<body>

<div class="face" id="face">
    <div class="eyes">
        <div id="l" class="eye"><div class="pupil"></div></div>
        <div id="r" class="eye"><div class="pupil"></div></div>
    </div>
    <div id="m" class="mouth"></div>
    <div id="status">Ťukni na mňa a budeme sa učiť!</div>
</div>

<div id="debug-log">Konzola: Režim "Mentor" pripravený.</div>

<style>
    body {
        margin: 0;
        background: #000b1e;
        color: white;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
    }
    .face {
        text-align: center;
        cursor: pointer;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
    }
    .face.disabled { cursor: not-allowed; opacity: 0.6; }

    .eyes { display: flex; gap: 60px; justify-content: center; }
    .eye {
        width: 90px; height: 90px; background: white; border-radius: 50%;
        position: relative; overflow: hidden; transition: 0.1s;
        box-shadow: 0 0 25px rgba(255,255,255,0.2);
    }
    .pupil {
        width: 30px; height: 30px; background: #222; border-radius: 50%;
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    .blink { height: 6px !important; }
    .blink .pupil { display: none; }

    .mouth { width: 130px; height: 15px; background: #ffcc00; margin: 40px auto; border-radius: 20px; transition: 0.2s; }
    .talking { height: 60px; border-radius: 50%; width: 60px; }

    #status { font-size: 20px; color: #00ffcc; font-weight: bold; margin-top: 20px; text-align: center; }
    #debug-log {
        width: 100%; height: 100px; background: #001a33; color: #446688;
        font-family: monospace; font-size: 10px; padding: 10px;
        border-top: 1px solid #003366; overflow-y: auto; box-sizing: border-box;
    }
</style>

<script>
    // ==========================================
    const API_KEY = 'SEM_VLOZ_SVOJ_GROQ_KLUC';
    const MODEL_NAME = 'llama-3.3-70b-versatile';
    // ==========================================

    const SYSTEM_PROMPT = "Si milý, múdry a veselý mentor pre deti. Tvojou úlohou je hravou formou učiť deti nové veci. Odpovedaj jednoducho a trpezlivo v slovenčine. Nepoužívaj žiadne smajlíky ani grafické symboly.";

    const logBox = document.getElementById('debug-log');
    const statusEl = document.getElementById('status');
    const mouth = document.getElementById('m');
    const face = document.getElementById('face');

    // História konverzácie
    const conversationHistory = [];

    // Stav – zabraňuje viacnásobným inštanciám
    let isListening = false;
    let recognition = null;

    function log(msg, color = "#446688") {
        logBox.innerHTML = `<span style="color:${color}">${new Date().toLocaleTimeString()} - ${msg}</span><br>` + logBox.innerHTML;
    }

    // Automatické žmurkanie
    setInterval(() => {
        document.querySelectorAll('.eye').forEach(e => e.classList.add('blink'));
        setTimeout(() => document.querySelectorAll('.eye').forEach(e => e.classList.remove('blink')), 150);
    }, 4000);

    function startBot() {
        // Ak práve hovorí, zastav reč a začni počúvať
        if (window.speechSynthesis.speaking) {
            window.speechSynthesis.cancel();
            log("Reč prerušená.", "orange");
        }

        // Wake Lock – zabraňuje zhasnutiu obrazovky
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(e => log("WakeLock chyba: " + e.message, "orange"));
        } else {
            log("WakeLock nie je podporovaný v tomto prehliadači.", "orange");
        }

        // Zabrání viacnásobným inštanciám mikrofónu
        if (isListening) {
            log("Mikrofón už beží, ignorujem klik.", "orange");
            return;
        }

        isListening = true;
        face.classList.add('disabled');

        recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'sk-SK';

        recognition.onstart = () => {
            statusEl.innerText = "Počúvam ťa...";
            log("Mikrofón aktívny.", "cyan");
        };

        recognition.onerror = (event) => {
            log("Chyba mikrofónu: " + event.error, "red");
            if (event.error === 'not-allowed') {
                statusEl.innerText = "Prístup k mikrofónu bol zamietnutý.";
            } else {
                statusEl.innerText = "Problém s mikrofónom. Skús znova.";
            }
            resetListeningState();
        };

        recognition.onend = () => {
            resetListeningState();
        };

        recognition.onresult = async (event) => {
            const text = event.results[0][0].transcript;
            log("Dieťa: " + text, "white");
            statusEl.innerText = "Rozmýšľam...";

            // Pridaj správu do histórie
            conversationHistory.push({ role: "user", content: text });

            try {
                const response = await fetch(
                    'https://api.groq.com/openai/v1/chat/completions',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${API_KEY}`
                        },
                        body: JSON.stringify({
                            model: MODEL_NAME,
                            messages: [
                                { role: "system", content: SYSTEM_PROMPT },
                                ...conversationHistory
                            ]
                        })
                    }
                );

                const data = await response.json();

                if (data.error) {
                    log("API chyba: " + data.error.message, "orange");
                    statusEl.innerText = "Skús to o chvíľu, práve oddychujem.";
                    conversationHistory.pop();
                    return;
                }

                const reply = data.choices[0].message.content;

                // Pridaj odpoveď do histórie
                conversationHistory.push({ role: "assistant", content: reply });

                log("Odpoveď prijatá.", "lightgreen");
                speak(reply);

            } catch (err) {
                log("Chyba spojenia: " + err.message, "red");
                statusEl.innerText = "Problém so sieťou. Skús znova.";
                conversationHistory.pop();
            }
        };

        try {
            recognition.start();
        } catch (e) {
            log("Chyba pri štarte mikrofónu: " + e.message, "red");
            resetListeningState();
        }
    }

    function resetListeningState() {
        isListening = false;
        face.classList.remove('disabled');
    }

    function speak(text) {
        // Moderný emoji filter (Unicode property escapes)
        const cleanText = text.replace(/\p{Emoji}/gu, '');

        const u = new SpeechSynthesisUtterance(cleanText);
        u.lang = 'sk-SK';
        u.pitch = 1.2;
        u.onstart = () => {
            mouth.classList.add('talking');
            statusEl.innerText = "Hovorím...";
        };
        u.onend = () => {
            mouth.classList.remove('talking');
            statusEl.innerText = "Pýtaj sa ďalej!";
        };
        u.onerror = (e) => {
            log("Chyba syntézy reči: " + e.error, "red");
            mouth.classList.remove('talking');
            statusEl.innerText = "Pýtaj sa ďalej!";
        };
        window.speechSynthesis.speak(u);
    }

    face.addEventListener('click', startBot);
</script>

</body>
</html>
